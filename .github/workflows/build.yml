# Genera el .exe de Windows en cada push.
# - En cualquier rama: el .zip queda como "artifact" de la ejecución (pestaña Actions).
# - En main: además se publica como release "ultima-version" para descargarlo fácil.
name: Build Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Godot y plantillas
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Descargar Godot y plantillas de exportación
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe
          rm -f *.zip *.tpz

      - name: Instalar plantillas
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          cp ~/godot/templates/* $dest/

      - name: Exportar
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --export-release "Windows" build/ONU-Outbreak.exe
          test -f build/ONU-Outbreak.exe
          cd build && zip -q ONU-Outbreak-windows.zip ONU-Outbreak.exe

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONU-Outbreak-windows-${{ github.sha }}
          path: build/ONU-Outbreak-windows.zip

      - name: Publicar "ultima-version" (solo main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version build/ONU-Outbreak-windows.zip \
            --prerelease --title "Última versión (${GITHUB_SHA::7})" \
            --notes "Generada automáticamente desde main. Descomprime el .zip y ejecuta ONU-Outbreak.exe."
